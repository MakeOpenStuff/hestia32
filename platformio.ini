; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s

framework = espidf
monitor_speed = 115200
monitor_filters = colorize, time, log2file
; Set partition table to support OTA
board_build.partitions = partitions_two_ota.csv

; Build configuration for better ESP-IDF integration
build_flags =
    -D ESP_PLATFORM=1

; Better build error reporting
build_type = debug

; NOTE: ESP32-C5 is not yet supported by PlatformIO
; For ESP32-C5 development, use native ESP-IDF v5.5:
;   source ~/esp/esp-idf-v5.5/export.sh
;   idf.py --preview build
;   idf.py --preview -p /dev/ttyUSB0 flash monitor
; Or run: ./setup-c5.sh
